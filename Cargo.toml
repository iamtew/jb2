[package]
name = "jb2"
version = "0.1.3"
edition = "2021"
description = "JB2 — Jukeboks 2.0, local Twitch / YTMD song-request control plane"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
native-tls = "0.2"
url = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Imaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = false
codegen-units = 16
