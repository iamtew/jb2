<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JB2 — Jukeboks 2.0</title>
    <link rel="icon" href="img/jukeboks.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing">
    <div id="stage"></div>
    <img id="logoFallback" class="logo-fallback" src="img/jukeboks.png" alt="" />
    <main class="landing-copy">
      <p class="eyebrow">Twitch · YouTube Music · OBS</p>
      <h1>JB2</h1>
      <div class="deck" id="deck">
        <button type="button" id="deckPlay" aria-label="Play">
          <svg class="icon" aria-hidden="true"><use id="deckPlayIcon" href="icons.svg#player-play"></use></svg>
        </button>
        <label class="deck-track">
          <span class="visually-hidden">Track</span>
          <select id="deckTrack">
            <option value="snd/tew020-game_time_game_boi.mp3">Game Time Game Boi</option>
            <option value="snd/tew020-music_makers.mp3">Music Makers</option>
            <option value="snd/tew020-space_invade_space.mp3">Space Invade Space</option>
          </select>
        </label>
        <div class="deck-vol" id="deckVolWrap">
          <button type="button" id="deckVolBtn" aria-label="Volume" aria-expanded="false" aria-controls="deckVolPop">
            <svg class="icon" aria-hidden="true"><use href="icons.svg#volume"></use></svg>
          </button>
          <div class="deck-vol-pop" id="deckVolPop">
            <label>
              <span class="visually-hidden">Volume</span>
              <input id="deckVol" type="range" min="0" max="1" step="0.01" value="0.6" />
            </label>
          </div>
        </div>
        <audio id="deckAudio" preload="none"></audio>
      </div>
      <p>
        Local control plane for YouTube Music Desktop: Twitch song requests, an OBS overlay,
        Overlay Stage, and a Control Panel. For <a href="https://github.com/pear-devs/pear-desktop">pear-desktop</a>,
        not the original <a href="https://github.com/th-ch/youtube-music">YouTube Music Desktop</a>.
      </p>
      <p class="actions">
        <a class="button" href="https://github.com/iamtew/jb2/releases/latest"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"></use></svg>Download</a>
        <a class="button" href="docs.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#book"></use></svg>Documentation</a>
        <a class="button secondary" href="docs.html#credits"><svg class="icon" aria-hidden="true"><use href="icons.svg#certificate"></use></svg>Credits</a>
        <a class="button secondary" href="https://github.com/iamtew/jb2"><svg class="icon" aria-hidden="true"><use href="icons.svg#brand-github"></use></svg>GitHub</a>
      </p>
    </main>
    <section class="look" aria-label="Look">
      <a href="docs.html#admin">
        <figure>
          <img src="img/admin-queue.png" alt="Control Panel queue with player dock" />
          <figcaption>Control Panel</figcaption>
        </figure>
      </a>
      <a href="docs.html#stage">
        <figure>
          <img src="img/stage.png" alt="Overlay Stage composer" />
          <figcaption>Overlay Stage</figcaption>
        </figure>
      </a>
    </section>
    <script src="icons.js"></script>
    <script src="vendor/pixi.min.js"></script>
    <script src="hero.js"></script>
  </body>
</html>
