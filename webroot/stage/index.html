<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay Stage</title>
    <link rel="icon" href="/img/jukeboks.png" />
    <link rel="stylesheet" href="/overlay/style.css?v=20261030j" />
    <link rel="stylesheet" href="/stage/style.css?v=20261030i" />
  </head>
  <body>
    <!-- Tabler Icons (outline), MIT. https://github.com/tabler/tabler-icons -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <symbol id="refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
        <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
      </symbol>
      <symbol id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" />
        <path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" />
      </symbol>
      <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12l5 5l10 -10" />
      </symbol>
    </svg>
    <header class="stage-bar">
      <h1>Overlay Stage</h1>
      <p class="stage-hint">Drag or resize. OBS at <code>/overlay/</code> follows live.</p>
      <div class="stage-field stage-bar-grid">Grid
        <span class="stage-control stage-grid-picks">
          <span class="stage-grid-checks">
            <label><input type="checkbox" name="grid" value="thirds" checked /> Thirds</label>
            <label><input type="checkbox" name="grid" value="center" checked /> Center</label>
            <label><input type="checkbox" name="grid" value="golden" /> Golden</label>
            <label><input type="checkbox" name="grid" value="safe" /> Safe areas</label>
            <label><input type="checkbox" name="grid" value="quad" /> 4×4</label>
          </span>
          <button type="button" class="stage-reset" data-reset="grid" aria-label="Reset grid">
            <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
          </button>
        </span>
      </div>
      <label class="stage-check stage-bar-snap">
        <input id="snapInput" type="checkbox" checked /> Snap
      </label>
      <div class="stage-sizes" role="group" aria-label="Canvas size">
        <button type="button" id="size720" class="stage-size">720p</button>
        <button type="button" id="size1080" class="stage-size">1080p</button>
      </div>
      <button type="button" id="copyOverlayUrl" class="stage-reset" aria-label="Copy Overlay URL" title="Copy Overlay URL">
        <svg class="icon" aria-hidden="true"><use href="#copy"></use></svg>
      </button>
    </header>
    <div class="stage-body">
      <aside class="stage-side">
        <div class="stage-field">Layers
          <ol id="layerList" class="stage-layers"></ol>
        </div>
        <div class="stage-tabs" role="tablist" aria-label="Stage settings">
          <button type="button" class="stage-tab is-active" role="tab" aria-selected="true" data-stage-tab="overlay">Overlay</button>
          <button type="button" class="stage-tab" role="tab" aria-selected="false" data-stage-tab="viz">Viz</button>
        </div>
        <div class="stage-tab-panel" role="tabpanel" data-stage-panel="overlay">
          <label class="stage-field">Theme
            <span class="stage-control">
              <select id="themeSelect">
                <option value="lcd-glass">LCD Glass</option>
                <option value="lower-third">Lower Third</option>
                <option value="amber-terminal">Amber Terminal</option>
                <option value="crypt">Crypt</option>
                <option value="fraktur">Fraktur</option>
                <option value="konstrukt">Konstrukt</option>
                <option value="street">Street</option>
                <option value="drop">Drop</option>
                <option value="capsule">Capsule</option>
                <option value="poster">Poster</option>
              </select>
              <button type="button" class="stage-reset" data-reset="theme" aria-label="Reset theme">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Seek
            <span class="stage-control">
              <select id="seekSelect">
                <option value="sesh-sofa">Sesh Sofa</option>
                <option value="ice">Ice</option>
                <option value="magenta">Magenta</option>
                <option value="white">White</option>
                <option value="sunset">Sunset</option>
                <option value="forest">Forest</option>
                <option value="gold">Gold</option>
                <option value="lava">Lava</option>
                <option value="ocean">Ocean</option>
                <option value="candy">Candy</option>
                <option value="ultraviolet">Ultraviolet</option>
                <option value="acid">Acid</option>
                <option value="copper">Copper</option>
                <option value="cherry">Cherry</option>
                <option value="vapor">Vapor</option>
                <option value="graphite">Graphite</option>
                <option value="honey">Honey</option>
              </select>
              <button type="button" class="stage-reset" data-reset="seekStyle" aria-label="Reset seek">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Seek direction
            <span class="stage-control">
              <select id="seekDirSelect">
                <option value="lr">Left → right</option>
                <option value="rl">Right → left</option>
                <option value="tb">Bottom → top</option>
                <option value="bt">Top → bottom</option>
              </select>
              <button type="button" class="stage-reset" data-reset="seekDir" aria-label="Reset seek direction">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Playing
            <span class="stage-control">
              <input id="playingOpacity" type="range" min="0" max="1" step="0.05" value="1" />
              <button type="button" class="stage-reset" data-reset="playingOpacity" aria-label="Reset playing opacity">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Paused
            <span class="stage-control">
              <input id="pausedOpacity" type="range" min="0" max="1" step="0.05" value="0.25" />
              <button type="button" class="stage-reset" data-reset="pausedOpacity" aria-label="Reset paused opacity">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Pulse
            <span class="stage-control">
              <input id="pulseInput" type="range" min="0" max="10" step="1" value="3" />
              <button type="button" class="stage-reset" data-reset="pulse" aria-label="Reset pulse">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-check">
            <span class="stage-control">
              <input id="glassInput" type="checkbox" checked /> Glass
              <button type="button" class="stage-reset" data-reset="glass" aria-label="Reset glass">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <button type="button" class="stage-reset stage-reset-size" data-reset="size" aria-label="Reset size">
            <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
            Size
          </button>
        </div>
        <div class="stage-tab-panel" role="tabpanel" data-stage-panel="viz" hidden>
          <label class="stage-check">
            <span class="stage-control">
              <input id="vizInput" type="checkbox" /> Visualizer
            </span>
          </label>
          <fieldset id="vizLook" class="stage-viz-look" disabled>
          <label class="stage-field">Output
            <span class="stage-control">
              <select id="vizDevice" aria-label="Visualizer output"></select>
            </span>
            <span id="vizStatus" class="stage-viz-status"></span>
          </label>
          <label class="stage-field">Style
            <span class="stage-control">
              <select id="vizStyle">
                <option value="bands">Bands</option>
                <option value="wave">Wave</option>
                <option value="dots">Dots</option>
                <option value="trail">Trail</option>
                <option value="warp">Warp</option>
              </select>
              <button type="button" class="stage-reset" data-viz-reset="style" aria-label="Reset style">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Bands
            <span class="stage-control">
              <input id="vizBands" type="range" min="1" max="32" step="1" value="16" />
              <output id="vizBandsOut" class="stage-viz-out" for="vizBands">16</output>
              <button type="button" class="stage-reset" data-viz-reset="bands" aria-label="Reset bands">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Color
            <span class="stage-control">
              <select id="vizColor">
                <option value="">Follow seek</option>
                <option value="sesh-sofa">Sesh Sofa</option>
                <option value="ice">Ice</option>
                <option value="magenta">Magenta</option>
                <option value="white">White</option>
                <option value="sunset">Sunset</option>
                <option value="forest">Forest</option>
                <option value="gold">Gold</option>
                <option value="lava">Lava</option>
                <option value="ocean">Ocean</option>
                <option value="candy">Candy</option>
                <option value="ultraviolet">Ultraviolet</option>
                <option value="acid">Acid</option>
                <option value="copper">Copper</option>
                <option value="cherry">Cherry</option>
                <option value="vapor">Vapor</option>
                <option value="graphite">Graphite</option>
                <option value="honey">Honey</option>
              </select>
              <button type="button" class="stage-reset" data-viz-reset="color" aria-label="Reset color">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Direction
            <span class="stage-control">
              <select id="vizColorDir">
                <option value="lr">Left → right</option>
                <option value="rl">Right → left</option>
                <option value="tb">Bottom → top</option>
                <option value="bt">Top → bottom</option>
              </select>
              <button type="button" class="stage-reset" data-viz-reset="colorDir" aria-label="Reset direction">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Smoothing
            <span class="stage-control">
              <input id="vizSmoothing" type="range" min="0" max="1" step="0.05" value="0.35" />
              <button type="button" class="stage-reset" data-viz-reset="smoothing" aria-label="Reset smoothing">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-check">
            <span class="stage-control">
              <input id="vizMirror" type="checkbox" /> Mirror
              <button type="button" class="stage-reset" data-viz-reset="mirror" aria-label="Reset mirror">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          <label class="stage-field">Peak fall
            <span class="stage-control">
              <input id="vizPeak" type="range" min="0" max="1" step="0.05" value="0.35" />
              <button type="button" class="stage-reset" data-viz-reset="peakFall" aria-label="Reset peak fall">
                <svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>
              </button>
            </span>
          </label>
          </fieldset>
        </div>
      </aside>
      <div class="stage-fit" id="stageFit">
        <div class="stage-canvas" id="stageCanvas">
          <div class="viz-box" id="vizBox">
            <div class="viz-layer" aria-hidden="true"></div>
            <div class="overlay-handles" aria-hidden="true">
              <span class="overlay-handle" data-handle="n"></span>
              <span class="overlay-handle" data-handle="s"></span>
              <span class="overlay-handle" data-handle="e"></span>
              <span class="overlay-handle" data-handle="w"></span>
              <span class="overlay-handle" data-handle="ne"></span>
              <span class="overlay-handle" data-handle="nw"></span>
              <span class="overlay-handle" data-handle="se"></span>
              <span class="overlay-handle" data-handle="sw"></span>
            </div>
          </div>
          <div class="stage-grid" aria-hidden="true">
            <svg id="stageGridLines"></svg>
          </div>
          <div class="overlay-box" id="overlayBox">
            <div id="songInfo" data-theme="lcd-glass" data-seek="sesh-sofa" data-seek-dir="lr">
              <p id="overlayState"><span class="overlay-state-lead">Jukeboks Paused</span><span class="overlay-state-hint">Add song with !sr &lt;song / URL&gt;</span></p>
              <div id="infoRow">
                <div id="playState">⏸</div>
                <div id="textBlock">
                  <div id="artistWrap">
                    <div id="artist"><span class="overlay-marquee-track">Artist</span></div>
                  </div>
                  <div id="titleWrap">
                    <div id="title"><span class="overlay-marquee-track">Title</span></div>
                  </div>
                  <div id="albumWrap">
                    <div id="album"><span class="overlay-marquee-track">Album</span></div>
                  </div>
                </div>
              </div>
              <div id="progress">
                <span id="currentTime">00:00</span>
                <div id="bar">
                  <div id="fill"></div>
                  <div id="marker"></div>
                </div>
                <span id="totalTime">00:00</span>
              </div>
            </div>
            <div class="overlay-handles" aria-hidden="true">
              <span class="overlay-handle" data-handle="n"></span>
              <span class="overlay-handle" data-handle="s"></span>
              <span class="overlay-handle" data-handle="e"></span>
              <span class="overlay-handle" data-handle="w"></span>
              <span class="overlay-handle" data-handle="ne"></span>
              <span class="overlay-handle" data-handle="nw"></span>
              <span class="overlay-handle" data-handle="se"></span>
              <span class="overlay-handle" data-handle="sw"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/vendor/pixi.min.js"></script>
    <script src="/overlay/viz.js?v=20261030d"></script>
    <script src="/overlay/fx.js?v=20261029ad"></script>
    <script src="/overlay/now.js?v=20261030i"></script>
    <script src="/stage/app.js?v=20261030j"></script>
  </body>
</html>
