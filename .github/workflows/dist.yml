# Windows release zip and per-user MSI. One artifact named dist.
# Push a numeric tag such as 0.0.1 to build and publish a GitHub Release.
# workflow_dispatch builds artifacts only.
name: dist

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content $env:GITHUB_PATH $tools
          $env:PATH = "$tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build dist
        shell: pwsh
        run: just build-dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.msi --generate-notes
